<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie - Online Food Delivery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Foodie</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#menu">Menu</a>
            <a href="#cart">Cart</a>
        </nav>
    </header>

    <section id="home" class="hero">
        <h2>Delicious food, delivered fast.</h2>
        <p>Order your favourite meals from nearby restaurants.</p>
        <button onclick="showLogin()">Login</button>
    </section>

    <section id="menu">
        <h2>Popular Menu</h2>

        <div class="food-container">

            <div class="food-card">
                <h3>Margherita Pizza</h3>
                <p>₹299</p>
                <button onclick="addToCart('Margherita Pizza', 299)">
                    Add to Cart
                </button>
            </div>

            <div class="food-card">
                <h3>Veg Burger</h3>
                <p>₹149</p>
                <button onclick="addToCart('Veg Burger', 149)">
                    Add to Cart
                </button>
            </div>

            <div class="food-card">
                <h3>White Sauce Pasta</h3>
                <p>₹249</p>
                <button onclick="addToCart('White Sauce Pasta', 249)">
                    Add to Cart
                </button>
            </div>

        </div>
    </section>

    <section id="cart">
        <h2>Your Cart</h2>

        <div id="cart-items">
            <p>Your cart is empty.</p>
        </div>

        <h3>Total: ₹<span id="total">0</span></h3>

        <button onclick="placeOrder()">Place Order</button>
    </section>

    <footer>
        <p>© 2026 Foodie Food Delivery</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
