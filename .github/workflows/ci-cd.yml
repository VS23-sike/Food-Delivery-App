name: Food Delivery CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-test-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build application
        run: |
          mkdir -p build
          cp index.html style.css script.js build/

      - name: Test application files
        run: |
          test -f build/index.html
          test -f build/style.css
          test -f build/script.js
          echo "All application files passed the test."

      - name: Package application
        run: |
          tar -czf food-delivery-app.tar.gz build/

      - name: Upload packaged application
        uses: actions/upload-artifact@v4
        with:
          name: food-delivery-app
          path: food-delivery-app.tar.gz

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website for deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build-test-package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4